<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EMPATH</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+TC:wght@300;400;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0D1B2A;--bg2:#1B2A4A;
  --white:#F7F4EF;--fog:#C9C5BC;--muted:#7B8FA1;
  --gold:#C9A84C;--amber:#E8A87C;--dawn:#F2E8D9;
  --e:#7B8FA1;--m:#A8B8C8;--p:#C9A84C;
  --a:#7A9E9F;--t:#E8A87C;--h:#F2E8D9;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--fog);font-family:'Noto Sans TC',sans-serif;overflow-x:hidden;}

/* ===== 導覽 ===== */
nav{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 40px;
  background:rgba(13,27,42,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.06);z-index:200;
}
.nav-logo{
  font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;
  color:var(--white);letter-spacing:6px;text-decoration:none;
}
.nav-letters{display:flex;gap:6px;}
.nav-letter{
  width:36px;height:36px;border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;
  cursor:pointer;transition:all .3s;text-decoration:none;color:var(--fog);
}
.nav-letter:hover{border-color:var(--amber);color:var(--amber);}
.nav-letter[data-l="E"]{color:var(--e);}
.nav-letter[data-l="M"]{color:var(--m);}
.nav-letter[data-l="P"]{color:var(--p);}
.nav-letter[data-l="A"]{color:var(--a);}
.nav-letter[data-l="T"]{color:var(--t);}
.nav-letter[data-l="H"]{color:var(--h);}

/* ===== HERO ===== */
#hero{
  min-height:100vh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
  padding:100px 40px 60px;position:relative;
}
.hero-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(60px,12vw,120px);font-weight:600;
  color:var(--white);letter-spacing:16px;line-height:1;margin-bottom:20px;
}
.hero-sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(15px,2.5vw,22px);color:var(--gold);
  letter-spacing:3px;margin-bottom:16px;
}
.hero-desc{font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:48px;}

/* 六扇門入口 */
.doors-nav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;}
.door-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:20px 16px;border:1px solid rgba(255,255,255,.08);
  cursor:pointer;transition:all .3s;text-decoration:none;min-width:80px;
}
.door-btn:hover{transform:translateY(-4px);}
.door-btn .dl{
  font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1;
}
.door-btn .dz{font-size:10px;letter-spacing:2px;color:var(--fog);}
.door-btn[data-d="E"]{border-color:rgba(123,143,161,.3);}
.door-btn[data-d="E"]:hover{border-color:var(--e);background:rgba(123,143,161,.05);}
.door-btn[data-d="E"] .dl{color:var(--e);}
.door-btn[data-d="M"]{border-color:rgba(168,184,200,.3);}
.door-btn[data-d="M"]:hover{border-color:var(--m);background:rgba(168,184,200,.05);}
.door-btn[data-d="M"] .dl{color:var(--m);}
.door-btn[data-d="P"]{border-color:rgba(201,168,76,.3);}
.door-btn[data-d="P"]:hover{border-color:var(--p);background:rgba(201,168,76,.05);}
.door-btn[data-d="P"] .dl{color:var(--p);}
.door-btn[data-d="A"]{border-color:rgba(122,158,159,.3);}
.door-btn[data-d="A"]:hover{border-color:var(--a);background:rgba(122,158,159,.05);}
.door-btn[data-d="A"] .dl{color:var(--a);}
.door-btn[data-d="T"]{border-color:rgba(232,168,124,.3);}
.door-btn[data-d="T"]:hover{border-color:var(--t);background:rgba(232,168,124,.05);}
.door-btn[data-d="T"] .dl{color:var(--t);}
.door-btn[data-d="H"]{border-color:rgba(242,232,217,.3);}
.door-btn[data-d="H"]:hover{border-color:var(--h);background:rgba(242,232,217,.05);}
.door-btn[data-d="H"] .dl{color:var(--h);}

.scroll-hint{font-size:10px;color:var(--muted);letter-spacing:3px;animation:pulse 2.5s infinite;}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}

/* ===== 通用區塊樣式 ===== */
.room{min-height:100vh;padding:100px 40px 80px;position:relative;}
.room-header{margin-bottom:48px;}
.room-letter{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(80px,15vw,140px);font-weight:600;
  line-height:1;margin-bottom:8px;opacity:.15;
  position:absolute;top:80px;right:40px;pointer-events:none;
}
.room-tag{font-size:10px;letter-spacing:4px;color:var(--muted);margin-bottom:8px;}
.room-title{
  font-family:'Noto Serif TC',serif;font-weight:700;
  font-size:clamp(22px,3vw,32px);color:var(--white);margin-bottom:8px;
}
.room-desc{font-size:13px;color:var(--muted);line-height:1.9;max-width:500px;}

/* 輸入框通用 */
.input-area{
  width:100%;max-width:640px;
  background:var(--bg2);border:1px solid rgba(255,255,255,.08);
  color:var(--white);font-family:'Noto Serif TC',serif;font-size:14px;
  padding:20px;line-height:1.9;resize:none;outline:none;
  transition:border-color .3s;
}
.input-area:focus{border-color:rgba(255,255,255,.2);}
.input-area::placeholder{color:var(--muted);}
.send-btn{
  display:inline-block;margin-top:12px;
  padding:12px 32px;border:1px solid;
  font-family:'Noto Serif TC',serif;font-size:12px;letter-spacing:2px;
  cursor:pointer;transition:all .3s;background:transparent;
}

/* ===== E 情緒垃圾桶 ===== */
#room-e{background:linear-gradient(180deg,#0D1B2A 0%,#0f1e2e 100%);}
#room-e .room-letter{color:var(--e);}
#room-e .room-tag{color:var(--e);}
#room-e .send-btn{border-color:var(--e);color:var(--e);}
#room-e .send-btn:hover{background:rgba(123,143,161,.1);}

.trash-container{max-width:640px;}
.trash-hint{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:14px;color:var(--muted);margin-bottom:16px;
}
.e-messages{margin-top:32px;display:flex;flex-direction:column;gap:12px;max-width:640px;}
.e-msg{
  background:var(--bg2);padding:16px 20px;
  border-left:2px solid rgba(123,143,161,.3);
  font-size:13px;line-height:1.9;color:var(--fog);
  position:relative;animation:fadeIn .5s ease;
}
.e-msg .msg-time{font-size:10px;color:var(--muted);margin-top:8px;letter-spacing:1px;}
.e-msg .anon-tag{
  font-size:10px;color:var(--e);letter-spacing:2px;margin-bottom:6px;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===== M 星空思念 ===== */
#room-m{background:#060e18;overflow:hidden;}
#room-m .room-letter{color:var(--m);}
#room-m .room-tag{color:var(--m);}
#room-m .send-btn{border-color:var(--m);color:var(--m);}
#room-m .send-btn:hover{background:rgba(168,184,200,.08);}

#star-canvas{
  position:absolute;inset:0;pointer-events:none;z-index:0;
}
#room-m .room-header,#room-m .m-input-wrap{position:relative;z-index:1;}
.m-input-wrap{max-width:480px;}

/* 星星tooltip */
.star-tooltip{
  position:fixed;
  background:rgba(13,27,42,.95);
  border:1px solid rgba(168,184,200,.2);
  padding:12px 16px;font-size:12px;color:var(--fog);
  pointer-events:none;z-index:300;max-width:200px;
  line-height:1.8;display:none;
}

/* ===== P 金繼 ===== */
#room-p{background:linear-gradient(180deg,#0D1B2A 0%,#13200f 100%);}
#room-p .room-letter{color:var(--p);}
#room-p .room-tag{color:var(--p);}
#room-p .send-btn{border-color:var(--p);color:var(--p);}
#room-p .send-btn:hover{background:rgba(201,168,76,.08);}

.kintsugi-board{
  max-width:640px;margin-top:32px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;
}
.shard{
  background:var(--bg2);padding:20px;
  position:relative;overflow:hidden;
  cursor:pointer;transition:all .4s;
  border:1px solid rgba(201,168,76,.1);
}
.shard::before{
  content:'';position:absolute;
  top:-1px;left:-1px;right:-1px;bottom:-1px;
  background:linear-gradient(135deg,transparent 40%,rgba(201,168,76,.15) 100%);
  pointer-events:none;
}
.shard-text{font-size:12px;line-height:1.9;color:var(--fog);}
.shard-glow{
  position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0;transition:opacity .4s;
}
.shard:hover .shard-glow{opacity:1;}
.shard.healed{border-color:rgba(201,168,76,.4);}
.shard.healed::after{
  content:'已修補';
  position:absolute;top:8px;right:8px;
  font-size:9px;color:var(--gold);letter-spacing:1px;
}
.p-crack{
  font-family:'Cormorant Garamond',serif;font-size:11px;
  color:rgba(201,168,76,.4);margin-top:8px;letter-spacing:1px;
}

/* ===== A 沙畫 ===== */
#room-a{background:linear-gradient(180deg,#0D1B2A 0%,#0a1520 100%);}
#room-a .room-letter{color:var(--a);}
#room-a .room-tag{color:var(--a);}
#room-a .send-btn{border-color:var(--a);color:var(--a);}
#room-a .send-btn:hover{background:rgba(122,158,159,.08);}

.sand-messages{margin-top:32px;display:flex;flex-direction:column;gap:16px;max-width:640px;}
.sand-msg{
  background:var(--bg2);padding:20px 24px;
  border-left:2px solid var(--a);
  position:relative;animation:fadeIn .5s ease;
  overflow:hidden;
}
.sand-msg .msg-content{font-size:13px;line-height:1.9;color:var(--fog);}
.sand-timer{
  font-size:10px;color:var(--a);letter-spacing:1px;
  margin-top:10px;display:flex;align-items:center;gap:6px;
}
.timer-bar{
  flex:1;height:2px;background:rgba(122,158,159,.2);
  border-radius:2px;overflow:hidden;
}
.timer-fill{
  height:100%;background:var(--a);
  transition:width 1s linear;
}
.sand-dissolve{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent,rgba(13,27,42,.9));
  opacity:0;pointer-events:none;transition:opacity 2s;
}
.sand-msg.dissolving .sand-dissolve{opacity:1;}
.sand-msg.dissolving{opacity:.3;transition:opacity 3s;}

/* ===== T 交換溫暖 ===== */
#room-t{background:linear-gradient(180deg,#0D1B2A 0%,#1a150a 100%);}
#room-t .room-letter{color:var(--t);}
#room-t .room-tag{color:var(--t);}
#room-t .send-btn{border-color:var(--t);color:var(--t);}
#room-t .send-btn:hover{background:rgba(232,168,124,.08);}

.t-layout{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:900px;margin-top:32px;}
.t-panel{background:var(--bg2);padding:28px;}
.t-panel-title{
  font-family:'Noto Serif TC',serif;font-size:13px;font-weight:700;
  color:var(--white);margin-bottom:20px;letter-spacing:1px;
}
.warmth-feed{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;}
.warmth-feed::-webkit-scrollbar{width:2px;}
.warmth-feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);}
.warmth-item{
  padding:14px 16px;background:rgba(232,168,124,.05);
  border-left:2px solid rgba(232,168,124,.2);
  font-size:12px;line-height:1.9;color:var(--fog);
  position:relative;animation:fadeIn .5s ease;
}
.warmth-glow{
  position:absolute;top:8px;right:10px;
  width:8px;height:8px;border-radius:50%;
  background:var(--amber);opacity:.4;
  animation:glow 2s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.2;}50%{opacity:.8;}}
.pulse-btn{
  display:flex;align-items:center;gap:8px;
  margin-top:8px;padding:6px 0;
  background:transparent;border:none;cursor:pointer;
  font-size:10px;color:var(--muted);letter-spacing:1px;transition:color .3s;
}
.pulse-btn:hover{color:var(--amber);}
.pulse-btn .heart{font-size:12px;transition:transform .2s;}
.pulse-btn:hover .heart{transform:scale(1.3);}

/* ===== H 整合 ===== */
#room-h{background:linear-gradient(180deg,#0D1B2A 0%,#1a1a2a 100%);}
#room-h .room-letter{color:var(--h);}
#room-h .room-tag{color:var(--h);}

.h-journey{max-width:700px;margin-top:36px;}
.journey-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px;
}
.j-card{
  background:var(--bg2);padding:24px 20px;text-align:center;
  border-top:2px solid;
}
.j-card:nth-child(1){border-top-color:var(--e);}
.j-card:nth-child(2){border-top-color:var(--m);}
.j-card:nth-child(3){border-top-color:var(--p);}
.j-card:nth-child(4){border-top-color:var(--a);}
.j-card:nth-child(5){border-top-color:var(--t);}
.j-num{
  font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;
  color:var(--white);line-height:1;margin-bottom:4px;
}
.j-label{font-size:10px;color:var(--muted);letter-spacing:2px;}

.home-quote{
  background:var(--bg2);padding:36px;
  border-left:3px solid var(--dawn);margin-bottom:24px;
}
.home-quote p{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:18px;color:var(--dawn);line-height:2;
}
.lighthouse{
  text-align:center;padding:40px;
  border:1px solid rgba(242,232,217,.1);
}
.lighthouse-icon{font-size:48px;margin-bottom:16px;animation:flicker 3s ease-in-out infinite;}
@keyframes flicker{0%,100%{opacity:.6;}50%{opacity:1;}}
.lighthouse p{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:15px;color:var(--dawn);line-height:2;
}

/* ===== Footer ===== */
footer{
  padding:28px 40px;border-top:1px solid rgba(255,255,255,.06);
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;color:var(--muted);letter-spacing:2px;
}

/* ===== 通知 ===== */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg2);border:1px solid rgba(255,255,255,.1);
  padding:12px 24px;font-size:12px;color:var(--fog);letter-spacing:1px;
  opacity:0;transition:all .4s;z-index:999;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:768px){
  nav{padding:14px 20px;}
  .room{padding:90px 20px 60px;}
  .t-layout{grid-template-columns:1fr;}
  .journey-summary{grid-template-columns:repeat(2,1fr);}
  .kintsugi-board{grid-template-columns:1fr;}
  .room-letter{font-size:80px;top:70px;right:20px;}
}
</style>
</head>
<body>

<!-- 導覽 -->
<nav>
  <a href="#hero" class="nav-logo">EMPATH</a>
  <div class="nav-letters">
    <a class="nav-letter" data-l="E" href="#room-e">E</a>
    <a class="nav-letter" data-l="M" href="#room-m">M</a>
    <a class="nav-letter" data-l="P" href="#room-p">P</a>
    <a class="nav-letter" data-l="A" href="#room-a">A</a>
    <a class="nav-letter" data-l="T" href="#room-t">T</a>
    <a class="nav-letter" data-l="H" href="#room-h">H</a>
  </div>
</nav>

<!-- Hero -->
<section id="hero">
  <h1 class="hero-title">EMPATH</h1>
  <p class="hero-sub">Every Moment As Truth Heals</p>
  <p class="hero-desc">數位時代的情緒安放平台　以文學敘事對抗視覺霸權的設計實踐</p>
  <div class="doors-nav">
    <a class="door-btn" data-d="E" href="#room-e">
      <span class="dl">E</span><span class="dz">情緒出口</span>
    </a>
    <a class="door-btn" data-d="M" href="#room-m">
      <span class="dl">M</span><span class="dz">思念映射</span>
    </a>
    <a class="door-btn" data-d="P" href="#room-p">
      <span class="dl">P</span><span class="dz">碎片修補</span>
    </a>
    <a class="door-btn" data-d="A" href="#room-a">
      <span class="dl">A</span><span class="dz">神聖避難所</span>
    </a>
    <a class="door-btn" data-d="T" href="#room-t">
      <span class="dl">T</span><span class="dz">能量共振</span>
    </a>
    <a class="door-btn" data-d="H" href="#room-h">
      <span class="dl">H</span><span class="dz">靈魂歸宿</span>
    </a>
  </div>
  <span class="scroll-hint">↓ &nbsp; SCROLL</span>
</section>

<!-- E：情緒垃圾桶 -->
<section id="room-e" class="room">
  <div class="room-letter">E</div>
  <div class="room-header">
    <p class="room-tag">E — EMPTINESS / EXIT</p>
    <h2 class="room-title">情緒出口</h2>
    <p class="room-desc">說出那些說不出口的話。匿名投遞，我看不到是誰，只有情緒本身被接住。</p>
  </div>
  <div class="trash-container">
    <p class="trash-hint">❝ 你不需要解釋，不需要完整，只需要說出來。❞</p>
    <textarea class="input-area" id="e-input" rows="5"
      placeholder="在這裡寫下你說不出口的話……&#10;沒有人知道是你。"></textarea>
    <br>
    <button class="send-btn" onclick="submitE()">投入黑暗　→</button>
  </div>
  <div class="e-messages" id="e-feed"></div>
</section>

<!-- M：星空思念 -->
<section id="room-m" class="room">
  <canvas id="star-canvas"></canvas>
  <div class="room-letter">M</div>
  <div class="room-header">
